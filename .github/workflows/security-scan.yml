name: Security Scan Only

on:
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pom.xml'
      - 'src/**'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: OWASP Dependency Check
      run: mvn dependency-check:check
      continue-on-error: false

    - name: Check for Critical Vulnerabilities
      run: |
        if [ -f "target/dependency-check-report.html" ]; then
          echo "Checking for critical/blocker vulnerabilities..."
          # Extract CVSS scores from report
          CRITICAL_COUNT=$(grep -o "CVSS Score: [7-9]\.[0-9]" target/dependency-check-report.html | wc -l)
          if [ $CRITICAL_COUNT -gt 0 ]; then
            echo "❌ CRITICAL VULNERABILITIES FOUND: $CRITICAL_COUNT"
            echo "Build failing due to critical vulnerabilities"
            exit 1
          else
            echo "✅ No critical vulnerabilities found"
          fi
        fi

    - name: SpotBugs Security Analysis
      run: mvn spotbugs:check

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          target/dependency-check-report.html
          target/spotbugs.html
          target/spotbugsXml.xml

    - name: Comment PR with Security Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = './target/dependency-check-report.html';
          
          if (fs.existsSync(path)) {
            const content = fs.readFileSync(path, 'utf8');
            const criticalMatches = content.match(/CVSS Score: [7-9]\.[0-9]/g) || [];
            const criticalCount = criticalMatches.length;
            
            const comment = `
            ## 🔒 Security Scan Results
            
            ### OWASP Dependency Check
            - **Critical Vulnerabilities**: ${criticalCount}
            - **Status**: ${criticalCount > 0 ? '❌ FAILED' : '✅ PASSED'}
            
            ### SpotBugs Analysis
            - **Status**: ✅ Completed
            
            ${criticalCount > 0 ? '### ⚠️ Action Required\n\nCritical vulnerabilities detected. Please update dependencies before merging.' : '### ✅ Security Check Passed\n\nNo critical vulnerabilities found.'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

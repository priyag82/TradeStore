name: TradeStore CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    # These services match the connection details below
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tradestore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # The secret sauce: Mapping Spring properties to the GitHub Services
      - name: Run Build and Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tradestore
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/tradestore_audit
        run: mvn clean verify -P integration-tests

      - name: Run OWASP Dependency Check
        # -DfailBuildOnCVSS=7 ensures the build FAILS if High/Critical risks are found
        # -DskipUpdate=true is a fallback if the NVD API is throttled
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -Dformat=HTML \
            -DfailBuildOnCVSS=7 \
            -DskipUpdate=false
        continue-on-error: true

      - name: Check for critical/blocker vulnerabilities
        id: check-vulnerabilities
        run: |
          if [ -f target/dependency-check-report.html ]; then
            CRITICAL_COUNT=$(grep -i "Critical" target/dependency-check-report.html | wc -l || echo "0")
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ $CRITICAL_COUNT Critical vulnerabilities found. Failing build."
              exit 1
            fi
            echo "✅ No Critical vulnerabilities found."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-reports
          path: |
            target/surefire-reports/
            target/dependency-check-report.html
name: TradeStore CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: user
          POSTGRES_DB: tradestore
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: trade-store-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: trade-store-m2-

    - name: Run unit tests
      run: mvn test

    - name: Run integration tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tradestore
        SPRING_DATASOURCE_USERNAME: user
        SPRING_DATASOURCE_PASSWORD: password
        SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/tradestore_audit
        SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      run: mvn verify -P integration-tests

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: junit-test-results
        path: target/surefire-reports/

    - name: Run OWASP Dependency Check
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        echo "=== Starting OWASP Dependency Check ==="
        echo "NVD API Key: ${{ secrets.NVD_API_KEY }}"
        mvn org.owasp:dependency-check-maven:check \
          -Dformat=HTML \
          -DfailBuildOnCVSS=7 \
          -DskipUpdate=true || true
        echo "=== OWASP Scan Complete ==="

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owasp-vulnerability-report
        path: target/dependency-check-report.html
        retention-days: 30

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload All Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-complete-artifacts
        path: |
          target/surefire-reports/
          target/dependency-check-report.html
        retention-days: 30

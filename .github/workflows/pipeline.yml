name: TradeStore CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: trade-store-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: trade-store-m2-

    - name: Run unit tests
      run: mvn test -Dmaven.test.failure.ignore=true || true

    - name: Run integration tests
      run: mvn verify -Dmaven.test.failure.ignore=true || true

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: junit-test-results
        path: target/surefire-reports/

    - name: Run OWASP Dependency Check
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      run: |
        echo "=== Starting OWASP Dependency Check ==="
        echo "NVD API Key exists: ${{ secrets.NVD_API_KEY != '' }}"
        if [ "${{ secrets.NVD_API_KEY }}" != "" ]; then
          echo "Using NVD API key for full scan..."
          mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DfailBuildOnCVSS=7 -Dnvd.apiKey=$NVD_API_KEY -DfailOnError=false
        else
          echo "No NVD API key, running scan without updates..."
          mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DfailBuildOnCVSS=7 -DskipUpdate=true
        fi
        echo "=== OWASP Scan Complete ==="

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owasp-vulnerability-report
        path: target/dependency-check-report.html
        retention-days: 30

    - name: Upload All Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pipeline-complete-artifacts
        path: |
          target/surefire-reports/
          target/dependency-check-report.html
        retention-days: 30

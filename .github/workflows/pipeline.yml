name: TradeStore CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Setting up the infrastructure needed for Integration Tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_USER: user
          POSTGRES_DB: tradestore
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      # Adding MongoDB for the NoSQL requirement
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for all branches and tags

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: mvn test

      - name: Run integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tradestore
          SPRING_DATASOURCE_USERNAME: user
          SPRING_DATASOURCE_PASSWORD: password
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/tradestore_audit
        run: mvn verify -P integration-tests

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-results
          path: target/surefire-reports/*.xml

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run OWASP Dependency Check
        # We use -DskipUpdate=true if no API key is found to prevent 403 errors from NVD
        run: |
          mvn org.owasp:dependency-check-maven:check -Dformat=HTML -DskipUpdate=${{ secrets.NVD_API_KEY == '' }}
        continue-on-error: true # We handle the failure in the next custom step

      - name: Check for critical/blocker vulnerabilities
        id: check-vulnerabilities
        run: |
          if [ -f target/dependency-check-report.html ]; then
            CRITICAL_COUNT=$(grep -i "Critical" target/dependency-check-report.html | wc -l || echo "0")
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ $CRITICAL_COUNT Critical vulnerabilities found. Failing build as per DWS requirements."
              exit 1
            fi
            echo "✅ No Critical vulnerabilities found."
          else
            echo "⚠️ Scan report not found. Check Maven logs."
          fi

      - name: Upload Security Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-vulnerability-report
          path: target/dependency-check-report.html
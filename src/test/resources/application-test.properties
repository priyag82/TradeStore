# Test Profile Configuration
spring.profiles.active=test

# Test Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/tradestore_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=user
spring.datasource.password=password

# Test JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Test MongoDB Configuration
spring.data.mongodb.database=tradestore_test

# Test Kafka Configuration (disabled)
spring.kafka.enabled=false

# Test Logging Configuration
logging.level.com.tradestore=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.kafka=WARN

# Test Security Configuration
spring.security.enabled=false

# Test Management Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

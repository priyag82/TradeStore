# Demo Profile Configuration
spring.profiles.active=demo

# H2 Database Configuration for Demo
spring.datasource.url=jdbc:h2:mem:tradestore_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DEMO_DB_USERNAME:sa}
spring.datasource.password=${DEMO_DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# MongoDB Configuration (embedded for demo)
spring.data.mongodb.database=tradestore_demo_audit
spring.data.mongodb.auto-index-creation=true

# Kafka Configuration (disabled for demo)
spring.kafka.enabled=false

# Logging Configuration for Demo
logging.level.com.tradestore=INFO
logging.level.org.springframework.scheduling=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Enable scheduling for expiry demo
spring.task.scheduling.pool.size=2

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

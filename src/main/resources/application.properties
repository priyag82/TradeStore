# TradeStore Application Configuration

# Profile Configuration
spring.config.import=classpath:application-${spring.profiles.active:dev}.properties

# Application Info
spring.application.name=trade-store-service

# Server Configuration
server.port=8080

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd

# Security Configuration (disabled for REST API)
spring.security.user.name=${SECURITY_USERNAME:admin}
spring.security.user.password=${SECURITY_ADMIN_PASSWORD:}
spring.security.user.roles=ADMIN

# Disable security for REST endpoints
spring.security.enabled=false

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tradestore}
spring.datasource.username=${DATABASE_USERNAME:user}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# PostgreSQL Console (disabled for PostgreSQL)
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# MongoDB Configuration
spring.data.mongodb.database=${MONGODB_DATABASE:tradestore_audit_dev}
spring.data.mongodb.auto-index-creation=true

# Kafka Configuration
spring.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Logging Configuration
logging.level.com.tradestore=${LOGGING_LEVEL_TRADESTORE:DEBUG}
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_SQL_BINDER:TRACE}
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.data.jpa=DEBUG
